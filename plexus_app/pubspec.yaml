name: plexus_app
description: Plexus application — mobile-first encrypted mesh messenger.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Plexus packages
  plexus_core:
    path: ../packages/plexus_core
  plexus_protocol:
    path: ../packages/plexus_protocol
  plexus_crypto:
    path: ../packages/plexus_crypto
  plexus_storage:
    path: ../packages/plexus_storage
  plexus_transport:
    path: ../packages/plexus_transport
  plexus_discovery:
    path: ../packages/plexus_discovery
  plexus_mesh:
    path: ../packages/plexus_mesh
  plexus_ui:
    path: ../packages/plexus_ui

  # State management
  flutter_riverpod: ^3.3.2

  # Navigation
  go_router: ^14.0.0

  # Dependency injection
  get_it: ^8.0.0

  # Secure storage
  flutter_secure_storage: ^10.3.1

  # Network interface enumeration
  network_info_plus: ^8.1.0
  connectivity_plus: ^7.1.1

  # Local notifications
  flutter_local_notifications: ^22.0.1

  # Cryptography
  cryptography: ^2.7.0
  cryptography_flutter: ^2.3.2

  # Key types
  pointycastle: ^4.0.0

  # CBOR encoding
  cbor: ^6.3.2

  # UUID
  uuid: ^4.5.1

  # SQLite
  sqlite3: ^3.3.3
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.1

  # QR code
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0

  # File transfer
  file_picker: ^12.0.0-beta.5
  open_file: ^4.0.0

  # Media players
  audioplayers: ^6.1.0
  video_player: ^2.9.2

  # Image processing
  image: ^4.9.1

  # Sharing
  share_plus: ^13.1.0

  # Markdown
  markdown: ^7.2.2

  # URL launcher
  url_launcher: ^6.3.1

  # Biometric
  local_auth: ^3.0.1

  # WebRTC calls
  flutter_webrtc: ^1.5.1

  # Device utilities
  vibration: ^3.1.3
  wakelock_plus: ^1.1.4
  proximity_sensor: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
